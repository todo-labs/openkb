name: Refresh generated knowledge

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Generation mode
        required: true
        default: update
        type: choice
        options:
          - update
          - init

permissions:
  contents: write

concurrency:
  group: generated-knowledge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    environment: docs-generation
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the OpenKB CLI
        run: pnpm --filter @todo-labs/openkb build

      - name: Refresh generated knowledge
        run: node packages/cli/dist/index.js generate --${{ inputs.mode }} --output docs/content

      - name: Validate generated documentation
        run: pnpm --dir docs build

      - name: Commit refreshed knowledge
        run: |
          if git diff --quiet; then
            echo "No generated documentation changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/content docs/docs.json AGENTS.md CLAUDE.md
          git commit -m "docs: refresh generated knowledge"
          git push
